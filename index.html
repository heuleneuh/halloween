<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 1: La Citrouille Interactive</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a1a; /* Fond sombre pour l'ambiance */
            margin: 0;
            font-family: sans-serif;
        }

        /* Conteneur principal */
        .pumpkin-container {
            position: relative;
            width: 200px;
            height: 200px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        /* La citrouille elle-même */
        .pumpkin {
            width: 100%;
            height: 100%;
            background-color: #e67e22; /* Orange de base */
            border-radius: 50% 50% 45% 45%; /* Forme légèrement aplatie */
            position: relative;
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.2); /* Ombre interne pour le volume */
            overflow: hidden; /* Pour que la lumière ne dépasse pas */
        }

        /* Les côtes de la citrouille (détails) */
        .pumpkin::before, .pumpkin::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            width: 20px;
            background-color: rgba(0,0,0,0.1);
            border-radius: 50%;
        }
        .pumpkin::before { left: 30px; }
        .pumpkin::after { right: 30px; }

        /* La tige */
        .stem {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 25px;
            background-color: #5d4037;
            border-radius: 5px;
            z-index: -1;
        }

        /* Le visage (conteneur des yeux et bouche) */
        .face {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 140px;
            height: 100px;
        }

        /* Les yeux et la bouche par défaut (sombrés) */
        .eye, .mouth {
            background-color: #3e2723; /* Marron très sombre */
            position: absolute;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* Yeux triangulaires */
        .eye {
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 25px solid #3e2723; /* La couleur est gérée par le border */
            top: 10px;
        }
        .eye.left { left: 20px; transform: rotate(-10deg); }
        .eye.right { right: 20px; transform: rotate(10deg); }

        /* Correction de couleur pour les triangles via filter ou border-color hack si besoin, 
           ici on utilise une astuce simple : le border-bottom prend la couleur */
        .eye.left { border-bottom-color: #3e2723; }
        .eye.right { border-bottom-color: #3e2723; }

        /* Bouche en forme de sourire dentelé (simplifié par des divs ou clip-path, 
           ici on fait une forme simple avec border-radius) */
        .mouth {
            width: 80px;
            height: 40px;
            background-color: #3e2723;
            border-radius: 0 0 40px 40px; /* Demi-cercle */
            bottom: 10px;
            left: 30px;
        }

        /* --- L'INTERACTION MAGICIQUE (HOVER) --- */
        
        /* Quand on survole le conteneur, on change la couleur des éléments du visage */
        .pumpkin-container:hover .eye {
            border-bottom-color: #f1c40f; /* Jaune lumineux */
            box-shadow: 0 0 15px #f1c40f; /* Effet de lueur (glow) */
        }

        .pumpkin-container:hover .mouth {
            background-color: #f1c40f;
            box-shadow: 0 0 15px #f1c40f;
        }

        /* Petit effet de mouvement global */
        .pumpkin-container:hover {
            transform: scale(1.05);
        }

    </style>
</head>
<body>

    <div class="pumpkin-container">
        <div class="stem"></div>
        <div class="pumpkin">
            <div class="face">
                <div class="eye left"></div>
                <div class="eye right"></div>
                <div class="mouth"></div>
            </div>
        </div>
    </div>

</body>
</html>
